<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1d1915">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="נתנאל">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>נתנאל איבגי</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" sizes="180x180" href="./icon-180.png">
<link rel="icon" type="image/png" sizes="64x64" href="./favicon-64.png">
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#1d1915}
body{
  min-height:100svh;display:grid;place-items:center;
  padding:env(safe-area-inset-top) 24px env(safe-area-inset-bottom);
  color:#fff9f1;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
  background:radial-gradient(circle at 50% 30%,#3a2c21 0%,#1d1915 48%,#14110e 100%)
}
.shell{width:min(100%,420px);text-align:center;transform:translateY(-3vh)}
.logo{width:118px;height:118px;border-radius:30px;object-fit:cover;
  box-shadow:0 24px 60px rgba(0,0,0,.38),inset 0 1px rgba(255,255,255,.16)}
h1{margin:22px 0 6px;font-size:27px}
p{margin:0;color:#d7c3a6;font-size:14px}
.open-btn{
  margin-top:28px;border:1px solid #d79d3c;border-radius:15px;padding:14px 20px;
  background:#f3b94f;color:#332515;font-weight:750;font-size:16px;
  box-shadow:0 12px 28px rgba(0,0,0,.24)
}
.hint{margin-top:18px;color:#bba78c;font-size:12px;line-height:1.6}
.dots{display:none;justify-content:center;gap:7px;margin-top:28px;direction:ltr}
.dots.show{display:flex}
.dots i{width:7px;height:7px;border-radius:50%;background:#e0ad59;animation:dot 1s ease-in-out infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes dot{0%,100%{opacity:.3;transform:translateY(0)}50%{opacity:1;transform:translateY(-5px)}}
@media(prefers-reduced-motion:reduce){.dots i{animation:none}}
</style>
</head>
<body>
<main class="shell">
  <img class="logo" src="./logo.png" alt="">
  <h1>נתנאל איבגי</h1>
  <p>המרחב האישי שלי</p>

  <button id="openBtn" class="open-btn" type="button">פתח את המרחב</button>
  <div id="hint" class="hint">כדי להתקין: שתף → הוסף למסך הבית</div>
  <div id="dots" class="dots" aria-hidden="true"><i></i><i></i><i></i></div>
</main>

<script>
const APP_URL = "https://script.google.com/macros/s/AKfycbzKoTQD51B0KWn3yHHnBgDSX_2ZItqXPq-RrtP9uPgEN33LAi2jF7U1_FimwN7nxFgu/exec";
const isStandalone =
  (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) ||
  window.navigator.standalone === true;

function openApp() {
  document.getElementById('openBtn').style.display = 'none';
  document.getElementById('hint').style.display = 'none';
  document.getElementById('dots').classList.add('show');
  setTimeout(() => window.location.replace(APP_URL), 250);
}

document.getElementById('openBtn').addEventListener('click', openApp);

/* Important:
   In Safari/browser mode we DO NOT auto-redirect.
   This keeps the GitHub Pages URL active so Add to Home Screen
   installs the PWA with the correct name and icon.
   Only an installed standalone web app auto-opens Apps Script.
*/
if (isStandalone) {
  setTimeout(openApp, 650);
}
</script>
</body>
</html>
