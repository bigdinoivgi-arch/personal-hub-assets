<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1d1915">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="נתנאל">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>נתנאל איבגי</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" sizes="180x180" href="./icon-180.png">
<link rel="icon" type="image/png" sizes="64x64" href="./favicon-64.png">
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#1d1915}
body{
  min-height:100svh;display:grid;place-items:center;
  padding:env(safe-area-inset-top) 24px env(safe-area-inset-bottom);
  color:#fff9f1;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
  background:radial-gradient(circle at 50% 30%,#3a2c21 0%,#1d1915 48%,#14110e 100%)
}
.shell{width:min(100%,420px);text-align:center;transform:translateY(-3vh)}
.logo{width:118px;height:118px;border-radius:30px;object-fit:cover;
  box-shadow:0 24px 60px rgba(0,0,0,.38),inset 0 1px rgba(255,255,255,.16)}
h1{margin:22px 0 6px;font-size:27px}
p{margin:0;color:#d7c3a6;font-size:14px}
.hold{
  margin-top:28px;padding:12px 16px;border:1px solid rgba(224,184,111,.34);
  border-radius:999px;background:rgba(29,23,18,.52);color:#efd9b7;font-size:12px
}
.hint{margin-top:16px;color:#bba78c;font-size:12px;line-height:1.7}
</style>
</head>
<body>
<main class="shell">
  <img class="logo" src="./logo.png" alt="">
  <h1>נתנאל איבגי</h1>
  <p>המרחב האישי שלי</p>
  <div class="hold">מצב התקנה</div>
  <div class="hint">כעת: שתף → הוסף למסך הבית</div>
</main>
</body>
</html>
